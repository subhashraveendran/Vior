name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libusb-1.0-0-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install pkgconfiglite -y
          $libusb_ver = "1.0.27"
          $url = "https://github.com/libusb/libusb/releases/download/v${libusb_ver}/libusb-${libusb_ver}.7z"
          Invoke-WebRequest -Uri $url -OutFile libusb.7z
          7z x libusb.7z -olibusb
          # Debug: show extracted structure
          Get-ChildItem -Recurse libusb -Depth 4 | Select-Object FullName | Format-Table -AutoSize
          # Copy to C:\libusb
          $dest = "C:\libusb"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item -Recurse libusb\* $dest
          # Find libusb.h location
          $header = Get-ChildItem -Recurse $dest -Filter "libusb.h" | Select-Object -First 1
          $incdir = $header.DirectoryName
          Write-Host "Include dir: $incdir"
          # Find lib location
          $lib = Get-ChildItem -Recurse $dest -Filter "libusb-1.0.lib" | Where-Object { $_.FullName -match "MS64" } | Select-Object -First 1
          $libdir = $lib.DirectoryName
          Write-Host "Lib dir: $libdir"
          # Also copy DLL to a PATH location
          $dll = Get-ChildItem -Recurse $dest -Filter "libusb-1.0.dll" | Where-Object { $_.FullName -match "MS64" } | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName "C:\Windows\System32\" -Force }
          # Set env vars with actual paths
          $incdirUnix = $incdir -replace '\\','/'
          $libdirUnix = $libdir -replace '\\','/'
          # Create pkg-config file
          $pcdir = "$dest\pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcdir
          @"
          prefix=C:/libusb
          exec_prefix=`${prefix}
          libdir=$libdirUnix
          includedir=$incdirUnix

          Name: libusb-1.0
          Description: libusb-1.0
          Version: ${libusb_ver}
          Libs: -L$libdirUnix -llibusb-1.0
          Cflags: -I$incdirUnix
          "@ | Out-File -Encoding ASCII "$pcdir\libusb-1.0.pc"
          echo "PKG_CONFIG_PATH=$pcdir" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-L$libdirUnix" >> $env:GITHUB_ENV
          echo "CGO_CFLAGS=-I$incdirUnix" >> $env:GITHUB_ENV

      - name: Build CLI
        run: go build -o vior ./cmd/vior/

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Test
        run: go test ./internal/... -short

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: vior-${{ runner.os }}-${{ runner.arch }}
          path: vior*
