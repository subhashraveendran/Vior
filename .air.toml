root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/vior"
  cmd = "go build -o ./tmp/vior ./cmd/vior/"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "desktop", "docs", "node_modules"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "./tmp/vior start --fps 10 --port 8080"
  include_dir = []
  include_ext = ["go"]
  include_file = []
  kill_delay = "1s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
