name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # libusb Windows binaries, pinned by content.
  #
  # This archive is downloaded on the runner and its DLL is copied into
  # C:\Windows\System32, so whatever it contains executes inside every
  # subsequent Windows build. Fetching it over HTTPS only proves the transport
  # was not tampered with in flight — it says nothing about the bytes the
  # release host served. Pinning the digest means a swapped asset fails the
  # build instead of shipping.
  #
  # The digest was verified against two independent distribution channels
  # (the GitHub release CDN and the SourceForge mirror), which agreed on both
  # the hash and the 4101966-byte length. Update it deliberately, the same way,
  # whenever LIBUSB_VERSION changes.
  LIBUSB_VERSION: "1.0.27"
  LIBUSB_SHA256: "19835e290f46fab6bd8ce4be6ab7dc5209f1c04bad177065df485e51dc4118c8"

jobs:
  # ═══════════════════════════════════════════
  # 1. CLI — Go binary for macOS/Linux/Windows
  # ═══════════════════════════════════════════
  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: vior-cli-macOS
            binary: vior
          - os: ubuntu-latest
            artifact: vior-cli-Linux
            binary: vior
          - os: windows-2025
            artifact: vior-cli-Windows
            binary: vior.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libusb-1.0-0-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install pkgconfiglite -y
          $ErrorActionPreference = "Stop"
          $libusb_ver = "${env:LIBUSB_VERSION}"
          $expected = "${env:LIBUSB_SHA256}".ToLower()
          $url = "https://github.com/libusb/libusb/releases/download/v${libusb_ver}/libusb-${libusb_ver}.7z"
          Invoke-WebRequest -Uri $url -OutFile libusb.7z
          # Verify BEFORE extraction: this archive's DLL is copied into
          # System32, so an unverified one would execute in every later step.
          $actual = (Get-FileHash libusb.7z -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Error "libusb archive checksum mismatch`n  expected: $expected`n  actual:   $actual`nRefusing to extract."
            exit 1
          }
          Write-Host "libusb $libusb_ver checksum verified: $actual"
          7z x libusb.7z -olibusb
          $dest = "C:\libusb"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item -Recurse libusb\* $dest
          # Find actual paths
          $header = Get-ChildItem -Recurse $dest -Filter "libusb.h" | Select-Object -First 1
          $incdir = ($header.DirectoryName -replace '\\','/')
          $lib = Get-ChildItem -Recurse $dest -Filter "libusb-1.0.lib" | Where-Object { $_.FullName -match "MS64" } | Select-Object -First 1
          $libdir = ($lib.DirectoryName -replace '\\','/')
          $dll = Get-ChildItem -Recurse $dest -Filter "libusb-1.0.dll" | Where-Object { $_.FullName -match "MS64" } | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName "C:\Windows\System32\" -Force }
          Write-Host "Include: $incdir  Lib: $libdir"
          $pcdir = "$dest\pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcdir
          @"
          Name: libusb-1.0
          Description: libusb-1.0
          Version: ${libusb_ver}
          Libs: -L$libdir -llibusb-1.0
          Cflags: -I$incdir
          "@ | Out-File -Encoding ASCII "$pcdir\libusb-1.0.pc"
          echo "PKG_CONFIG_PATH=$pcdir" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-L$libdir" >> $env:GITHUB_ENV
          echo "CGO_CFLAGS=-I$incdir" >> $env:GITHUB_ENV

      - name: Build CLI
        run: go build -o ${{ matrix.binary }} ./cmd/vior/

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Gofmt (check formatting)
        if: runner.os != 'Windows'
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w \$(git ls-files '*.go')"
            exit 1
          fi

      - name: golangci-lint (report-only)
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m --issues-exit-code=0

      - name: Test
        run: go test ./internal/... -short

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  # ═══════════════════════════════════════════
  # 2. Desktop — Wails app for macOS/Linux/Windows
  # ═══════════════════════════════════════════
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: vior-desktop-macOS
          - os: ubuntu-22.04
            artifact: vior-desktop-Linux
          - os: windows-2025
            artifact: vior-desktop-Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libusb-1.0-0-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install pkgconfiglite -y
          $ErrorActionPreference = "Stop"
          $libusb_ver = "${env:LIBUSB_VERSION}"
          $expected = "${env:LIBUSB_SHA256}".ToLower()
          $url = "https://github.com/libusb/libusb/releases/download/v${libusb_ver}/libusb-${libusb_ver}.7z"
          Invoke-WebRequest -Uri $url -OutFile libusb.7z
          # Verify BEFORE extraction: this archive's DLL is copied into
          # System32, so an unverified one would execute in every later step.
          $actual = (Get-FileHash libusb.7z -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Error "libusb archive checksum mismatch`n  expected: $expected`n  actual:   $actual`nRefusing to extract."
            exit 1
          }
          Write-Host "libusb $libusb_ver checksum verified: $actual"
          7z x libusb.7z -olibusb
          $dest = "C:\libusb"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item -Recurse libusb\* $dest
          $header = Get-ChildItem -Recurse $dest -Filter "libusb.h" | Select-Object -First 1
          $incdir = ($header.DirectoryName -replace '\\','/')
          $lib = Get-ChildItem -Recurse $dest -Filter "libusb-1.0.lib" | Where-Object { $_.FullName -match "MS64" } | Select-Object -First 1
          $libdir = ($lib.DirectoryName -replace '\\','/')
          $dll = Get-ChildItem -Recurse $dest -Filter "libusb-1.0.dll" | Where-Object { $_.FullName -match "MS64" } | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName "C:\Windows\System32\" -Force }
          $pcdir = "$dest\pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcdir
          @"
          Name: libusb-1.0
          Description: libusb-1.0
          Version: ${libusb_ver}
          Libs: -L$libdir -llibusb-1.0
          Cflags: -I$incdir
          "@ | Out-File -Encoding ASCII "$pcdir\libusb-1.0.pc"
          echo "PKG_CONFIG_PATH=$pcdir" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-L$libdir" >> $env:GITHUB_ENV
          echo "CGO_CFLAGS=-I$incdir" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: cd desktop/frontend && npm install

      - name: Typecheck frontend
        run: cd desktop/frontend && npm run typecheck

      # Report-only lint — enabled once desktop/frontend adds a "lint" script.
      # - name: Lint frontend (report-only)
      #   continue-on-error: true
      #   run: cd desktop/frontend && npm run lint

      - name: Build desktop app
        run: |
          cd desktop
          wails build -clean -o vior-desktop

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/build/bin/*
            desktop/build/install-macos.sh

      - name: Upload Linux app
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/build/bin/*

      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/build/bin/*

  # ═══════════════════════════════════════════
  # 3. Mobile — Capacitor Android APK
  # ═══════════════════════════════════════════
  mobile:
    name: Mobile (Android)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: cd mobile-cap && npm install

      - name: Typecheck
        run: cd mobile-cap && npm run typecheck

      # Report-only lint — enabled once mobile-cap adds a "lint" script.
      # - name: Lint (report-only)
      #   continue-on-error: true
      #   run: cd mobile-cap && npm run lint

      - name: Compile TypeScript → JS (emits src/js/*.js consumed by Capacitor)
        run: cd mobile-cap && npm run build

      - name: Setup Android platform
        run: |
          cd mobile-cap
          # Save custom files before cap regenerates android/
          mkdir -p /tmp/vior-custom
          cp -r android/app/src/main/java                          /tmp/vior-custom/java               2>/dev/null || true
          cp -r android/app/src/main/res/xml                       /tmp/vior-custom/xml                2>/dev/null || true
          cp -r android/app/src/main/res/drawable                  /tmp/vior-custom/drawable           2>/dev/null || true
          cp -r android/app/src/main/res/drawable-anydpi-v24       /tmp/vior-custom/drawable-anydpi-v24 2>/dev/null || true
          cp -r android/app/src/main/res/mipmap-anydpi-v26         /tmp/vior-custom/mipmap-anydpi-v26  2>/dev/null || true
          cp -r android/app/src/main/res/values                    /tmp/vior-custom/values             2>/dev/null || true
          cp    android/app/src/main/AndroidManifest.xml           /tmp/vior-custom/AndroidManifest.xml 2>/dev/null || true

          # Regenerate Android project
          rm -rf android
          npx cap add android
          npx cap sync android

          # Overlay custom files
          cp -r /tmp/vior-custom/java/*                            android/app/src/main/java/                       2>/dev/null || true
          mkdir -p android/app/src/main/res/xml
          cp -r /tmp/vior-custom/xml/*                             android/app/src/main/res/xml/                    2>/dev/null || true
          mkdir -p android/app/src/main/res/drawable
          cp -r /tmp/vior-custom/drawable/*                        android/app/src/main/res/drawable/               2>/dev/null || true
          mkdir -p android/app/src/main/res/drawable-anydpi-v24
          cp -r /tmp/vior-custom/drawable-anydpi-v24/*             android/app/src/main/res/drawable-anydpi-v24/    2>/dev/null || true
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp -r /tmp/vior-custom/mipmap-anydpi-v26/*               android/app/src/main/res/mipmap-anydpi-v26/      2>/dev/null || true
          # Merge values (don't blow away cap defaults — copy each file by name)
          cp -r /tmp/vior-custom/values/*                          android/app/src/main/res/values/                 2>/dev/null || true
          # Restore custom AndroidManifest.xml — without this, `npx cap add android`
          # regenerates a stock manifest that lacks CAMERA / ACCESS_NETWORK_STATE /
          # ACCESS_WIFI_STATE / the USB-accessory intent filter, which silently
          # breaks the QR scanner (getUserMedia → NotReadableError on Android 15
          # because the runtime CAMERA permission can never be granted) and
          # USB auto-launch.
          cp    /tmp/vior-custom/AndroidManifest.xml               android/app/src/main/AndroidManifest.xml         2>/dev/null || true

      - name: Build debug APK
        run: |
          cd mobile-cap/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vior-mobile-Android
          path: mobile-cap/android/app/build/outputs/apk/debug/app-debug.apk
