<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Vior</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="connecting">
        <div class="connect-card">
            <img class="logo" src="/icon.svg" alt="Vior" width="72" height="72">
            <div class="spinner"></div>
            <p class="connect-text">Connecting to Vior...</p>
            <p class="connect-sub">Setting up your display</p>
        </div>
    </div>

    <div id="stream-view" class="hidden">
        <img id="stream" alt="Vior Stream">
        <button id="fullscreen-btn" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
        </button>
        <button id="settings-fab" aria-label="Settings" title="Settings"
                style="position: fixed; right: 18px; bottom: 18px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(20,23,28,.55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #fff; display: flex; align-items: center; justify-content: center; z-index: 10001; box-shadow: 0 8px 24px rgba(0,0,0,.45); cursor: pointer;">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06A2 2 0 1 1 4.14 16.92l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1.03H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.85a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.55V3a2 2 0 0 1 4 0v.09c0 .68.4 1.3 1.03 1.55a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.62.87 1.03 1.55 1.03H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1.03z"/>
            </svg>
        </button>
        <div id="settings-sheet" class="hidden"
             style="position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10002;">
            <div style="background: #14171c; color: #fff; padding: 22px 22px 18px; border-radius: 16px; min-width: 280px; max-width: 90vw; box-shadow: 0 18px 50px rgba(0,0,0,.55);">
                <div style="font-size: 16px; font-weight: 600; margin-bottom: 14px;">Stream settings</div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button id="ws-disconnect-btn" style="padding: 11px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(208,72,72,.85); color: #fff; font-weight: 600; cursor: pointer;">Disconnect</button>
                    <button id="ws-fullscreen-btn" style="padding: 11px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #fff; cursor: pointer;">Toggle Fullscreen</button>
                    <button id="ws-forget-btn" style="padding: 11px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #fff; cursor: pointer;">Forget this device + pair code</button>
                    <button id="ws-close-sheet" style="padding: 9px 14px; border-radius: 10px; border: none; background: transparent; color: rgba(255,255,255,.55); margin-top: 4px; cursor: pointer;">Close</button>
                </div>
            </div>
        </div>
        <div id="status-bar">
            <span id="conn-status" class="connected"></span>
            <span id="conn-text">Connected</span>
        </div>
    </div>

    <div id="disconnected" class="hidden">
        <div class="disconnect-card">
            <div class="disconnect-icon">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor" opacity="0.4">
                    <path d="M24 3.6L20.4 0 0 20.4 3.6 24l4.14-4.14c1.32.86 2.86 1.34 4.46 1.34 4.42 0 8-3.58 8-8 0-1.6-.48-3.14-1.34-4.46L24 3.6zM12.2 17.2c-1.12 0-2.18-.36-3.06-1.02L17.18 8.14c.66.88 1.02 1.94 1.02 3.06 0 3.32-2.68 5.6-6 6z"/>
                </svg>
            </div>
            <p class="disconnect-title">Disconnected</p>
            <p class="disconnect-sub">Attempting to reconnect...</p>
            <div class="reconnect-bar">
                <div class="reconnect-progress"></div>
            </div>
        </div>
    </div>

    <div id="error-view" class="hidden">
        <div class="error-card">
            <p class="error-title">Connection Error</p>
            <p id="error-msg" class="error-sub"></p>
            <div id="pair-row" class="hidden" style="margin: 14px 0 6px; display: flex; flex-direction: column; gap: 8px; align-items: stretch;">
                <label style="font-size: 12px; opacity: .7; text-align: left;">Pair code (shown on the desktop)</label>
                <input id="pair-input" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false"
                       style="padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #fff; font-size: 18px; font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.22em; text-transform: uppercase; text-align: center;">
            </div>
            <button id="retry-btn" class="retry-btn">Connect</button>
        </div>
    </div>

    <script src="/client.js"></script>
</body>
</html>
