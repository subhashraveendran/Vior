name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libusb-1.0-0-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install pkgconfiglite -y
          $libusb_ver = "1.0.27"
          $url = "https://github.com/libusb/libusb/releases/download/v${libusb_ver}/libusb-${libusb_ver}.7z"
          Invoke-WebRequest -Uri $url -OutFile libusb.7z
          7z x libusb.7z -olibusb
          $dest = "C:\libusb"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item -Recurse libusb\* $dest
          # Create pkg-config file for libusb
          $pcdir = "C:\libusb\pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcdir
          @"
          prefix=C:/libusb
          exec_prefix=`${prefix}
          libdir=`${prefix}/VS2022/MS64/dll
          includedir=`${prefix}/include/libusb-1.0

          Name: libusb-1.0
          Description: C API for USB device access from Windows userspace
          Version: ${libusb_ver}
          Libs: -L`${libdir} -llibusb-1.0
          Cflags: -I`${includedir}
          "@ | Out-File -Encoding ASCII "$pcdir\libusb-1.0.pc"
          echo "PKG_CONFIG_PATH=$pcdir" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:\libusb\VS2022\MS64\dll" >> $env:GITHUB_ENV
          echo "CGO_CFLAGS=-IC:\libusb\include\libusb-1.0" >> $env:GITHUB_ENV

      - name: Build CLI
        run: go build -o vior ./cmd/vior/

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Test
        run: go test ./internal/... -short

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: vior-${{ runner.os }}-${{ runner.arch }}
          path: vior*
