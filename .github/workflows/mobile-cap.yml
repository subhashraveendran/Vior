name: Capacitor Android

on:
  push:
    branches: [main]
    paths: ['mobile-cap/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: cd mobile-cap && npm install

      - name: Setup Android platform
        run: |
          cd mobile-cap
          # Save custom files before cap regenerates android/
          mkdir -p /tmp/vior-custom
          cp -r android/app/src/main/java /tmp/vior-custom/java 2>/dev/null || true
          cp -r android/app/src/main/res/xml /tmp/vior-custom/xml 2>/dev/null || true
          cp android/app/src/main/AndroidManifest.xml /tmp/vior-custom/AndroidManifest.xml 2>/dev/null || true

          # Let Capacitor generate fresh Android project
          rm -rf android
          npx cap add android
          npx cap sync android

          # Overlay custom files
          cp -r /tmp/vior-custom/java/* android/app/src/main/java/ 2>/dev/null || true
          mkdir -p android/app/src/main/res/xml
          cp -r /tmp/vior-custom/xml/* android/app/src/main/res/xml/ 2>/dev/null || true

          # Merge manifest — add USB permissions and intent filter
          # For now, use cleartext traffic which cap already enables

      - name: Build debug APK
        run: |
          cd mobile-cap/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vior-capacitor-android
          path: mobile-cap/android/app/build/outputs/apk/debug/app-debug.apk
