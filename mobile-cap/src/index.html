<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vior</title>
<style>
  :root {
    --bg: #0c0d12; --surface: #14161c; --border: #1e2029;
    --text: #c9cdd3; --dim: #5c6170; --head: #f0f1f3;
    --indigo: #6366f1; --indigo2: #818cf8; --green: #34d399; --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity 0.3s; }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* Discovery */
  .disc-header { padding: 56px 20px 16px; display: flex; align-items: center; gap: 12px; }
  .disc-mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #4f46e5); }
  .disc-title { font-size: 20px; font-weight: 700; color: var(--head); flex: 1; }
  .disc-scan { padding: 0 20px 14px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); }
  .disc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--indigo); animation: pulse 1.8s ease-in-out infinite; }
  .disc-sep { height: 1px; background: var(--border); }
  .disc-list { flex: 1; overflow-y: auto; padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; }

  .srv-card {
    padding: 14px; border-radius: 12px; background: var(--surface);
    box-shadow: inset 0 1px 0 #262833, 0 0 0 1px var(--border);
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .srv-card:active { opacity: 0.7; }
  .srv-icon { width: 42px; height: 42px; border-radius: 10px; background: #0a0b10; box-shadow: inset 0 0 0 1px var(--border); display: flex; align-items: center; justify-content: center; color: var(--dim); }
  .srv-info { flex: 1; min-width: 0; }
  .srv-name { font-size: 14px; font-weight: 600; color: var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srv-meta { font-size: 11px; color: var(--dim); margin-top: 2px; font-family: ui-monospace, monospace; }
  .srv-chev { color: var(--dim); font-size: 20px; }

  .empty { padding: 60px 40px; text-align: center; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--head); margin-bottom: 8px; }
  .empty-sub { font-size: 13px; color: var(--dim); line-height: 1.5; }

  .disc-bottom { padding: 16px 18px 32px; border-top: 1px solid var(--border); }
  .disc-label { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; margin-bottom: 8px; padding-left: 4px; }
  .ip-row { display: flex; align-items: center; background: var(--surface); border-radius: 10px; box-shadow: inset 0 1px 0 #262833, 0 0 0 1px var(--border); padding: 4px; }
  .ip-input { flex: 1; background: none; border: none; color: var(--text); font-size: 15px; padding: 8px 12px; outline: none; font-family: ui-monospace, monospace; }
  .ip-input::placeholder { color: var(--dim); }
  .ip-btn { padding: 9px 18px; border-radius: 8px; background: var(--indigo); color: #fff; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }

  /* Stream */
  #stream-screen { background: #000; }
  #stream-img { width: 100%; height: 100%; object-fit: contain; touch-action: none; }
  .stream-pill {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(16px);
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.15);
    color: #fff; font-size: 12px; font-weight: 600;
  }
  .stream-back {
    position: fixed; top: 52px; left: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(16px);
    border: none; color: #fff; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.15);
  }

  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,0.5); }

  .error-msg { padding: 8px 20px; font-size: 13px; color: var(--red); }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.85)} }
</style>
</head>
<body>

<!-- Discovery Screen -->
<div id="disc-screen" class="screen">
  <div class="disc-header">
    <div class="disc-mark"></div>
    <div class="disc-title">Connect</div>
  </div>
  <div class="disc-scan">
    <div class="disc-dot"></div>
    <span>Scanning your network...</span>
  </div>
  <div class="disc-sep"></div>
  <div id="server-list" class="disc-list">
    <div class="empty">
      <div class="empty-title">Searching...</div>
      <div class="empty-sub">Looking for Vior servers on your network</div>
    </div>
  </div>
  <div class="disc-bottom">
    <div class="disc-label">Connect manually</div>
    <div class="ip-row">
      <input id="ip-input" class="ip-input" type="text" placeholder="192.168.x.x" inputmode="url">
      <button id="ip-btn" class="ip-btn">Connect</button>
    </div>
    <div id="error" class="error-msg" style="display:none"></div>
  </div>
</div>

<!-- Stream Screen -->
<div id="stream-screen" class="screen hidden">
  <img id="stream-img" alt="Stream">
  <button id="back-btn" class="stream-back">‹</button>
  <div class="stream-pill">
    <span class="conn-dot"></span>
    <span>Connected</span>
  </div>
</div>

<script>
(function() {
  var discScreen = document.getElementById('disc-screen');
  var streamScreen = document.getElementById('stream-screen');
  var serverList = document.getElementById('server-list');
  var ipInput = document.getElementById('ip-input');
  var ipBtn = document.getElementById('ip-btn');
  var backBtn = document.getElementById('back-btn');
  var streamImg = document.getElementById('stream-img');
  var errorEl = document.getElementById('error');
  var ws = null;
  var displayW = 0, displayH = 0;

  function showScreen(id) {
    discScreen.classList.toggle('hidden', id !== 'disc');
    streamScreen.classList.toggle('hidden', id !== 'stream');
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = msg ? 'block' : 'none';
  }

  function connect(host, port) {
    showError('');
    var wsUrl = 'ws://' + host + ':' + port + '/ws';
    ws = new WebSocket(wsUrl);
    ws.onopen = function() {
      var dpr = window.devicePixelRatio || 1;
      var w = Math.round(screen.width * dpr);
      var h = Math.round(screen.height * dpr);
      ws.send(JSON.stringify({type:'hello',data:{width:w,height:h,dpr:dpr,name:'Vior Mobile'}}));
    };
    ws.onmessage = function(e) {
      var msg = JSON.parse(e.data);
      if (msg.type === 'ready') {
        displayW = parseInt(msg.data.resolution.split('x')[0]);
        displayH = parseInt(msg.data.resolution.split('x')[1]);
        streamImg.src = 'http://' + host + ':' + port + msg.data.streamUrl;
        showScreen('stream');
        // Save last connection.
        localStorage.setItem('vior_last', host + ':' + port);
      } else if (msg.type === 'error') {
        showError(msg.data.message);
      }
    };
    ws.onclose = function() {
      showScreen('disc');
    };
    ws.onerror = function() {
      showError('Connection failed');
    };
  }

  // Manual connect.
  ipBtn.onclick = function() {
    var val = ipInput.value.trim();
    if (!val) return;
    var parts = val.split(':');
    connect(parts[0], parts[1] || '8080');
  };
  ipInput.onkeydown = function(e) { if (e.key === 'Enter') ipBtn.click(); };

  // Back button.
  backBtn.onclick = function() {
    if (ws) { ws.close(); ws = null; }
    streamImg.src = '';
    showScreen('disc');
  };

  // Touch forwarding.
  function mapTouch(t) {
    var r = streamImg.getBoundingClientRect();
    return { x: Math.round((t.clientX-r.left)/r.width*displayW), y: Math.round((t.clientY-r.top)/r.height*displayH) };
  }
  function send(ev,act,x,y) {
    if (ws && ws.readyState===1) ws.send(JSON.stringify({type:'input',data:{event:ev,action:act,x:x,y:y}}));
  }
  streamImg.addEventListener('touchstart',function(e){e.preventDefault();var p=mapTouch(e.changedTouches[0]);send('touch','down',p.x,p.y);},{passive:false});
  streamImg.addEventListener('touchmove',function(e){e.preventDefault();var p=mapTouch(e.changedTouches[0]);send('touch','move',p.x,p.y);},{passive:false});
  streamImg.addEventListener('touchend',function(e){e.preventDefault();var p=mapTouch(e.changedTouches[0]);send('touch','up',p.x,p.y);},{passive:false});

  // UDP discovery not available in WebView — poll HTTP instead.
  // Try to find server by scanning common ports on gateway.
  function autoDiscover() {
    // Try last known server first.
    var last = localStorage.getItem('vior_last');
    if (last) {
      var p = last.split(':');
      tryServer(p[0], p[1], true);
    }
  }

  function tryServer(host, port, auto) {
    fetch('http://'+host+':'+port+'/snapshot', {mode:'no-cors', signal: AbortSignal.timeout(2000)})
      .then(function() {
        addServerCard(host, port, 'Saved server');
        if (auto) connect(host, port);
      }).catch(function(){});
  }

  function addServerCard(host, port, label) {
    serverList.innerHTML = '';
    var card = document.createElement('div');
    card.className = 'srv-card';
    card.innerHTML = '<div class="srv-icon">🖥</div><div class="srv-info"><div class="srv-name">'+(label||host)+'</div><div class="srv-meta">'+host+':'+port+'</div></div><div class="srv-chev">›</div>';
    card.onclick = function() { connect(host, port); };
    serverList.appendChild(card);
  }

  autoDiscover();
})();
</script>
</body>
</html>
