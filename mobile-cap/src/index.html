<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vior</title>
<link rel="manifest" href="manifest.json">
<style>
  /* ══════════════════════════════════════════════
     Design tokens — matched to desktop/frontend
     ══════════════════════════════════════════════ */
  :root {
    --bg: #0c0d12;
    --bg-deep: #0a0b10;
    --surface: #14161c;
    --surface2: #181a22;
    --border: #1e2029;
    --border-h: #262833;
    --text: #c9cdd3;
    --dim: #5c6170;
    --dim2: #3a3e48;
    --head: #f0f1f3;
    --white: #ffffff;
    --indigo: #6366f1;
    --indigo-l: #818cf8;
    --indigo-d: #4f46e5;
    --indigo-dim: #4f52c9;
    --green: #34d399;
    --red: #ef4444;
    --amber: #f59e0b;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  /* ── Reset ─────────────────────── */
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }
  button { font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  input { font-family:inherit; }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .hidden { display:none!important; }

  /* ── Dot grid background (matches desktop) ── */
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
    background-size: 14px 14px;
    opacity: 0.035;
  }

  /* ── Screen transitions ─────────── */
  .screen {
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column;
    opacity:0; transform:translateY(12px);
    transition: opacity 0.4s cubic-bezier(0.25,0.1,0.25,1),
                transform 0.4s cubic-bezier(0.25,0.1,0.25,1);
    pointer-events:none;
  }
  .screen.active { opacity:1; transform:translateY(0); pointer-events:auto; }

  /* ══════════════════════════════════════
     DISCOVERY SCREEN
     ══════════════════════════════════════ */
  .disc-header {
    padding: calc(14px + var(--safe-t)) 20px 0;
    display:flex; align-items:center; gap:12px;
  }
  .brand-mark {
    width:38px; height:38px; border-radius:10px;
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 16px -2px rgba(99,102,241,0.45);
    flex-shrink:0;
  }
  .brand-mark svg { width:20px; height:20px; }
  .brand-title {
    font-size:22px; font-weight:700; color:var(--head);
    letter-spacing:-0.4px;
  }

  /* Scan status bar */
  .scan-bar {
    padding:14px 20px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .scan-dot {
    width:8px; height:8px; border-radius:50%;
    background:var(--indigo); position:relative; flex-shrink:0;
  }
  .scan-dot.scanning::after {
    content:''; position:absolute; inset:-4px;
    border-radius:50%; border:1.5px solid var(--indigo);
    animation: scan-ring 2.2s ease-out infinite;
  }
  .scan-dot.found { background:var(--green); }
  .scan-dot.found::after { display:none; }
  .scan-dot.none { background:var(--amber); }
  .scan-dot.none::after { display:none; }
  .scan-label { font-size:13px; color:var(--dim); font-weight:500; }

  @keyframes scan-ring {
    0% { transform:scale(1); opacity:0.6; }
    100% { transform:scale(2.8); opacity:0; }
  }

  .divider { height:1px; background:var(--border); margin:0 20px; }

  /* ── Server list ── */
  .server-area { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .server-list { padding:14px 16px 0; }

  /* ── Server card (engraved style) ── */
  .srv-card {
    padding:16px; border-radius:12px;
    background:var(--surface);
    box-shadow: inset 0 1px 0 var(--border-h),
                inset 0 -1px 0 var(--bg-deep),
                0 0 0 1px var(--border);
    display:flex; align-items:center; gap:14px;
    margin-bottom:10px;
    transition: box-shadow 0.25s, transform 0.15s;
  }
  .srv-card:active { transform:scale(0.98); }
  .srv-card.selected {
    box-shadow: inset 0 1px 0 var(--border-h),
                inset 0 -1px 0 var(--bg-deep),
                0 0 0 1.5px var(--indigo),
                0 4px 24px -4px rgba(99,102,241,0.35);
  }
  .srv-icon-box {
    width:46px; height:46px; border-radius:11px;
    background:var(--bg-deep);
    box-shadow: inset 0 1px 0 var(--border-h), 0 0 0 1px var(--border);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .srv-icon-box svg { width:22px; height:22px; color:var(--dim); }
  .srv-card.selected .srv-icon-box svg { color:var(--indigo-l); }
  .srv-body { flex:1; min-width:0; }
  .srv-name {
    font-size:15px; font-weight:600; color:var(--head);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .srv-meta {
    font-size:11.5px; color:var(--dim); margin-top:3px;
    display:flex; align-items:center; gap:6px;
  }
  .srv-meta-dot { width:3px; height:3px; border-radius:50%; background:var(--dim2); }
  .srv-chevron svg { color:var(--dim2); }
  .srv-card.selected .srv-chevron svg { color:var(--indigo-l); }

  /* ── Searching state ── */
  .search-state {
    padding:40px 32px; display:flex; flex-direction:column;
    align-items:center; text-align:center;
  }
  /* Radar animation */
  .radar {
    width:80px; height:80px; position:relative; margin-bottom:24px;
  }
  .radar-ring {
    position:absolute; border-radius:50%;
    border:1.5px solid var(--indigo);
    animation: radar-expand 2.4s ease-out infinite;
  }
  .radar-ring:nth-child(1) { inset:20px; animation-delay:0s; }
  .radar-ring:nth-child(2) { inset:10px; animation-delay:0.6s; }
  .radar-ring:nth-child(3) { inset:0; animation-delay:1.2s; }
  .radar-core {
    position:absolute; top:50%; left:50%;
    width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%; background:var(--indigo);
    box-shadow:0 0 16px rgba(99,102,241,0.5);
  }
  @keyframes radar-expand {
    0% { opacity:0.6; transform:scale(0.5); }
    100% { opacity:0; transform:scale(1.6); }
  }
  .search-title { font-size:17px; font-weight:600; color:var(--head); margin-bottom:6px; }
  .search-desc { font-size:13px; color:var(--dim); line-height:1.6; max-width:260px; }

  /* ── No servers found ── */
  .empty-state {
    padding:36px 32px; display:flex; flex-direction:column;
    align-items:center; text-align:center;
  }
  .empty-icon-box {
    width:60px; height:60px; border-radius:16px;
    background:var(--surface);
    box-shadow: inset 0 1px 0 var(--border-h), 0 0 0 1px var(--border);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:20px;
  }
  .empty-icon-box svg { width:26px; height:26px; color:var(--dim); }
  .empty-title { font-size:16px; font-weight:600; color:var(--head); margin-bottom:6px; }
  .empty-desc { font-size:13px; color:var(--dim); line-height:1.6; max-width:260px; }

  /* ── Manual IP ── */
  .manual-section { padding:16px 16px 0; }
  .manual-row { display:flex; gap:8px; }
  .manual-input {
    flex:1; height:44px; padding:0 14px;
    border-radius:8px; background:var(--surface);
    border:1px solid var(--border); color:var(--head);
    font-size:15px; outline:none;
    transition:border-color 0.2s;
  }
  .manual-input::placeholder { color:var(--dim2); }
  .manual-input:focus { border-color:var(--indigo); }
  .manual-go {
    height:44px; padding:0 18px;
    border-radius:8px; background:var(--surface2);
    border:1px solid var(--border);
    color:var(--text); font-size:13px; font-weight:600;
    transition:background 0.2s;
  }
  .manual-go:active { background:var(--border); }
  .retry-btn {
    width:100%; height:40px; margin-top:10px;
    border-radius:8px; background:none;
    border:1px solid var(--border);
    color:var(--dim); font-size:12.5px; font-weight:500;
  }
  .retry-btn:active { background:var(--surface); }

  /* ── Bottom panel (mode + connect) ── */
  .bottom-panel {
    background: linear-gradient(0deg, var(--bg) 60%, transparent);
    padding:0 16px calc(16px + var(--safe-b));
  }

  /* ── Mode picker ── */
  .mode-section { padding:12px 0 14px; }
  .section-label {
    font-size:10.5px; font-weight:600; color:var(--dim);
    text-transform:uppercase; letter-spacing:1px;
    padding:0 2px 10px;
  }
  .mode-row { display:flex; gap:10px; }
  .mode-card {
    flex:1; padding:14px 10px;
    border-radius:12px; background:var(--surface);
    box-shadow: inset 0 1px 0 var(--border-h),
                inset 0 -1px 0 var(--bg-deep),
                0 0 0 1px var(--border);
    text-align:center;
    transition: box-shadow 0.25s, transform 0.15s;
  }
  .mode-card:active { transform:scale(0.97); }
  .mode-card.active {
    box-shadow: inset 0 1px 0 var(--border-h),
                0 0 0 1.5px var(--indigo),
                0 4px 20px -4px rgba(99,102,241,0.35);
  }
  .mode-card-icon {
    width:38px; height:38px; border-radius:10px;
    background:var(--bg-deep);
    box-shadow: inset 0 1px 0 var(--border-h), 0 0 0 1px var(--border);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 8px;
    transition:border-color 0.2s, background 0.2s;
  }
  .mode-card-icon svg { width:18px; height:18px; color:var(--dim); transition:color 0.2s; }
  .mode-card.active .mode-card-icon {
    border-color:rgba(99,102,241,0.3);
    background:rgba(99,102,241,0.08);
    box-shadow:0 0 0 1px rgba(99,102,241,0.3);
  }
  .mode-card.active .mode-card-icon svg { color:var(--indigo-l); }
  .mode-name { font-size:13.5px; font-weight:600; color:var(--head); transition:color 0.2s; }
  .mode-card.active .mode-name { color:var(--indigo-l); }
  .mode-desc { font-size:10.5px; color:var(--dim); margin-top:2px; }

  /* ── Connect button (matches desktop PrimaryButton) ── */
  .connect-btn {
    width:100%; height:48px;
    border-radius:8px; border:none;
    background: linear-gradient(180deg, #7376f4 0%, #5a5ee3 100%);
    color:var(--white);
    font-size:14.5px; font-weight:600; letter-spacing:0.2px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25),
                0 0 0 1px rgba(99,102,241,0.6),
                0 8px 28px -4px rgba(99,102,241,0.55);
    transition: opacity 0.2s, transform 0.15s;
  }
  .connect-btn:active { transform:scale(0.98); }
  .connect-btn:disabled { opacity:0.3; transform:none; box-shadow:none; }
  .error-text {
    text-align:center; padding:10px 0 0;
    font-size:13px; color:var(--red); font-weight:500;
  }

  /* ══════════════════════════════════════
     CONNECTING SCREEN
     ══════════════════════════════════════ */
  .connecting-body {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px;
    padding:40px;
  }
  .spinner {
    width:72px; height:72px; position:relative;
  }
  .spinner-track {
    position:absolute; inset:0;
    border:2px solid var(--border);
    border-top-color:var(--indigo);
    border-radius:50%;
    animation: spin 0.9s linear infinite;
  }
  .spinner-core {
    position:absolute; top:50%; left:50%;
    width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%; background:var(--indigo);
    box-shadow:0 0 20px rgba(99,102,241,0.4);
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .connecting-title { font-size:16px; font-weight:600; color:var(--head); }
  .connecting-sub { font-size:13px; color:var(--dim); margin-top:-12px; }
  .cancel-btn {
    margin-top:8px; padding:10px 28px;
    border-radius:8px; background:none;
    border:1px solid var(--border);
    color:var(--dim); font-size:12.5px; font-weight:500;
  }
  .cancel-btn:active { background:var(--surface); }

  /* ══════════════════════════════════════
     STREAM SCREEN
     ══════════════════════════════════════ */
  #stream-screen { background:#000; }
  #stream-img {
    width:100%; height:100%;
    object-fit:contain; touch-action:none;
    background:#000;
  }

  /* Overlay — auto-hides */
  .stream-overlay {
    position:fixed; inset:0; z-index:10;
    pointer-events:none;
    transition:opacity 0.4s cubic-bezier(0.25,0.1,0.25,1);
  }
  .stream-overlay.dimmed { opacity:0; }

  .stream-top {
    position:absolute; top:0; left:0; right:0;
    padding:calc(8px + var(--safe-t)) 14px 16px;
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(180deg, rgba(0,0,0,0.75) 0%, transparent 100%);
    pointer-events:auto;
  }
  .stream-back {
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.08);
    color:var(--white); display:flex; align-items:center; justify-content:center;
  }
  .stream-back:active { background:rgba(255,255,255,0.2); }
  .stream-device { flex:1; font-size:14px; font-weight:600; color:var(--white); }
  .stream-badge {
    padding:4px 10px; border-radius:6px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.08);
    font-size:10.5px; font-weight:600; color:rgba(255,255,255,0.65);
    text-transform:uppercase; letter-spacing:0.5px;
  }

  .stream-bottom {
    position:absolute; bottom:0; left:0; right:0;
    padding:16px 16px calc(12px + var(--safe-b));
    display:flex; justify-content:center;
    background:linear-gradient(0deg, rgba(0,0,0,0.75) 0%, transparent 100%);
    pointer-events:auto;
  }
  .stream-pill {
    display:flex; align-items:center; gap:8px;
    padding:8px 16px; border-radius:999px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.06);
  }
  .pill-dot {
    width:7px; height:7px; border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px rgba(52,211,153,0.4);
  }
  .pill-dot.reconnecting {
    background:var(--amber);
    box-shadow:0 0 8px rgba(245,158,11,0.3);
    animation:blink 1s ease-in-out infinite;
  }
  .pill-text { font-size:12px; font-weight:600; color:rgba(255,255,255,0.8); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .stream-loading {
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    background:#000;
  }
  .stream-loading-spinner {
    width:36px; height:36px; border:2px solid #222;
    border-top-color:var(--indigo); border-radius:50%;
    animation:spin 0.9s linear infinite;
  }
  .stream-loading-text { font-size:13px; color:var(--dim); }

  /* ── Toast (matches desktop) ── */
  .toast {
    position:fixed; bottom:calc(24px + var(--safe-b));
    left:50%; transform:translateX(-50%);
    padding:10px 18px; border-radius:999px;
    background:rgba(20,22,28,0.92);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
    z-index:100; opacity:0; transform:translateX(-50%) translateY(16px);
    transition:opacity 0.25s, transform 0.25s;
    pointer-events:none;
  }
  .toast.show {
    opacity:1; transform:translateX(-50%) translateY(0);
  }
  .toast-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .toast-dot.green { background:var(--green); box-shadow:0 0 8px rgba(52,211,153,0.4); }
  .toast-dot.red { background:var(--red); box-shadow:0 0 8px rgba(239,68,68,0.4); }
  .toast-msg { font-size:12.5px; font-weight:500; color:var(--text); white-space:nowrap; }
</style>
</head>
<body>

<!-- ═══ Toast ═══ -->
<div id="toast" class="toast">
  <span id="toast-dot" class="toast-dot green"></span>
  <span id="toast-msg" class="toast-msg"></span>
</div>

<!-- ═══════════════════════════════
     DISCOVERY SCREEN
     ═══════════════════════════════ -->
<div id="disc-screen" class="screen active">
  <div class="disc-header">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
    </div>
    <div class="brand-title">Vior</div>
  </div>

  <div class="scan-bar">
    <div id="scan-dot" class="scan-dot scanning"></div>
    <span id="scan-label" class="scan-label">Scanning network…</span>
  </div>
  <div class="divider"></div>

  <div class="server-area">
    <div id="server-list" class="server-list"></div>
  </div>

  <div id="manual-section" class="manual-section hidden">
    <div class="manual-row">
      <input id="manual-ip" class="manual-input mono" type="text" placeholder="192.168.1.100" inputmode="url">
      <button id="manual-go" class="manual-go">Go</button>
    </div>
    <button id="retry-btn" class="retry-btn">Scan again</button>
  </div>

  <div id="bottom-panel" class="bottom-panel hidden">
    <div id="mode-section" class="mode-section">
      <div class="section-label">Display Mode</div>
      <div class="mode-row">
        <div id="mode-extend" class="mode-card active" data-mode="extend">
          <div class="mode-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="10" height="7" rx="1"/>
              <rect x="13" y="4" width="10" height="7" rx="1"/>
              <path d="M6 14v3M18 14v3M3 17h6M15 17h6"/>
            </svg>
          </div>
          <div class="mode-name">Extend</div>
          <div class="mode-desc">Extra screen space</div>
        </div>
        <div id="mode-mirror" class="mode-card" data-mode="mirror">
          <div class="mode-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
              <path d="M9 8l3-2 3 2M9 12l3 2 3-2"/>
            </svg>
          </div>
          <div class="mode-name">Mirror</div>
          <div class="mode-desc">Clone main display</div>
        </div>
      </div>
    </div>
    <button id="connect-btn" class="connect-btn" disabled>Connect</button>
    <div id="error-text" class="error-text hidden"></div>
  </div>
</div>

<!-- ═══════════════════════════════
     CONNECTING SCREEN
     ═══════════════════════════════ -->
<div id="connecting-screen" class="screen">
  <div class="connecting-body">
    <div class="spinner">
      <div class="spinner-track"></div>
      <div class="spinner-core"></div>
    </div>
    <div class="connecting-title">Connecting…</div>
    <div class="connecting-sub" id="connecting-sub">Setting up display</div>
    <button id="cancel-btn" class="cancel-btn">Cancel</button>
  </div>
</div>

<!-- ═══════════════════════════════
     STREAM SCREEN
     ═══════════════════════════════ -->
<div id="stream-screen" class="screen">
  <img id="stream-img" alt="">
  <div id="stream-loading" class="stream-loading">
    <div class="stream-loading-spinner"></div>
    <span class="stream-loading-text">Waiting for frames…</span>
  </div>
  <div id="stream-overlay" class="stream-overlay">
    <div class="stream-top">
      <button id="back-btn" class="stream-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span id="stream-device" class="stream-device"></span>
      <span id="stream-badge" class="stream-badge"></span>
    </div>
    <div class="stream-bottom">
      <div class="stream-pill">
        <span id="pill-dot" class="pill-dot"></span>
        <span id="pill-text" class="pill-text">Connected</span>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var $ = function(id) { return document.getElementById(id); };
  var ws = null, displayW = 0, displayH = 0;
  var selectedServer = null, selectedMode = 'extend', serverName = '';
  var streamImg = $('stream-img');
  var framePolling = false, frameBaseUrl = '', blobUrl = null;
  var overlayTimer = null, reconnectAttempts = 0, maxReconnect = 5;
  var currentScreen = 'disc', toastTimer = null;

  // ── SVG Icons ──
  var ICONS = {
    mac: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    win: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>',
    linux: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M8 12c-2 1-3 3-3 5 0 2 3 4 7 4s7-2 7-4c0-2-1-4-3-5"/><circle cx="10" cy="7" r="0.5" fill="currentColor"/><circle cx="14" cy="7" r="0.5" fill="currentColor"/></svg>'
  };
  function platformIcon(p) {
    return p === 'macOS' ? ICONS.mac : p === 'Windows' ? ICONS.win : p === 'Linux' ? ICONS.linux : ICONS.mac;
  }

  // ── Toast ──
  function showToast(msg, type) {
    var t = $('toast'), dot = $('toast-dot'), m = $('toast-msg');
    dot.className = 'toast-dot ' + (type === 'error' ? 'red' : 'green');
    m.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3000);
  }

  // ── Screen transitions ──
  function showScreen(id) {
    ['disc','connecting','stream'].forEach(function(s) {
      var el = $(s + '-screen');
      if (s === id) {
        el.classList.remove('hidden');
        void el.offsetWidth;
        el.classList.add('active');
      } else {
        el.classList.remove('active');
        setTimeout(function() { if (!el.classList.contains('active')) el.classList.add('hidden'); }, 400);
      }
    });
    currentScreen = id;
  }

  function showError(msg) {
    var el = $('error-text');
    if (msg) { el.textContent = msg; el.classList.remove('hidden'); }
    else el.classList.add('hidden');
  }

  // ── Mode selection ──
  document.querySelectorAll('.mode-card').forEach(function(card) {
    card.addEventListener('click', function() {
      selectedMode = card.dataset.mode;
      $('mode-extend').classList.toggle('active', selectedMode === 'extend');
      $('mode-mirror').classList.toggle('active', selectedMode === 'mirror');
    });
  });

  // ── Discovery ──
  var foundServers = {}, discoveryTimeout = null;

  function startDiscovery() {
    foundServers = {}; selectedServer = null;
    $('scan-dot').className = 'scan-dot scanning';
    $('scan-label').textContent = 'Scanning network…';
    $('server-list').innerHTML = '';
    $('manual-section').classList.add('hidden');
    $('bottom-panel').classList.add('hidden');

    // Radar searching animation
    $('server-list').innerHTML =
      '<div class="search-state">' +
        '<div class="radar">' +
          '<div class="radar-ring"></div><div class="radar-ring"></div><div class="radar-ring"></div>' +
          '<div class="radar-core"></div>' +
        '</div>' +
        '<div class="search-title">Searching…</div>' +
        '<div class="search-desc">Looking for Vior servers on your network</div>' +
      '</div>';

    // Try last connected
    var last = localStorage.getItem('vior_last');
    if (last) {
      var p = last.split(':');
      probeServer(p[0], parseInt(p[1]));
    }

    // Subnet scan
    getLocalIP(function(ip) {
      if (!ip) { setTimeout(showManualFallback, 2500); return; }
      var base = ip.split('.').slice(0, 3).join('.');
      var batch = 0;
      function scanBatch() {
        var start = batch * 20 + 1;
        var end = Math.min(start + 20, 255);
        for (var i = start; i < end; i++) probeServer(base + '.' + i, 8080);
        batch++;
        if (batch < 13 && !selectedServer) setTimeout(scanBatch, 300);
      }
      scanBatch();
    });

    discoveryTimeout = setTimeout(function() {
      if (!selectedServer) showManualFallback();
    }, 7000);
  }

  function probeServer(host, port) {
    var key = host + ':' + port;
    if (foundServers[key]) return;
    var ctrl = new AbortController();
    setTimeout(function() { ctrl.abort(); }, 1500);

    fetch('http://' + host + ':' + port + '/info', { signal: ctrl.signal })
      .then(function(r) { return r.json(); })
      .then(function(info) {
        if (foundServers[key]) return;
        foundServers[key] = info;

        $('scan-dot').className = 'scan-dot found';
        $('scan-label').textContent = 'Server found';
        clearTimeout(discoveryTimeout);

        if (!selectedServer) $('server-list').innerHTML = '';
        addServerCard(host, port, info.name || host, info.platform || '');
        if (!selectedServer) {
          selectServer(host, port, info.name || host);
          showToast('Found ' + (info.name || host), 'ok');
        }
      })
      .catch(function() {});
  }

  function addServerCard(host, port, name, platform) {
    var card = document.createElement('div');
    card.className = 'srv-card';
    card.id = 'srv-' + host.replace(/\./g, '-') + '-' + port;
    card.innerHTML =
      '<div class="srv-icon-box">' + platformIcon(platform) + '</div>' +
      '<div class="srv-body">' +
        '<div class="srv-name">' + esc(name) + '</div>' +
        '<div class="srv-meta"><span>' + esc(platform) + '</span><span class="srv-meta-dot"></span><span>Wi-Fi</span></div>' +
      '</div>' +
      '<div class="srv-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>';
    card.addEventListener('click', function() { selectServer(host, port, name); });
    $('server-list').appendChild(card);
  }

  function selectServer(host, port, name) {
    selectedServer = { host: host, port: port };
    serverName = name || host;
    document.querySelectorAll('.srv-card').forEach(function(c) { c.classList.remove('selected'); });
    var el = $('srv-' + host.replace(/\./g, '-') + '-' + port);
    if (el) el.classList.add('selected');
    $('bottom-panel').classList.remove('hidden');
    $('connect-btn').disabled = false;
    $('connect-btn').textContent = 'Connect';
    showError('');
  }

  function showManualFallback() {
    $('scan-dot').className = 'scan-dot none';
    $('scan-label').textContent = 'No servers found';
    if (!selectedServer) {
      $('server-list').innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.56 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg></div>' +
          '<div class="empty-title">No servers found</div>' +
          '<div class="empty-desc">Make sure Vior is running on your computer and both devices are on the same Wi-Fi</div>' +
        '</div>';
    }
    $('manual-section').classList.remove('hidden');
  }

  // ── WebRTC IP detection ──
  function getLocalIP(cb) {
    try {
      var pc = new RTCPeerConnection({ iceServers: [] }), done = false;
      pc.createDataChannel('');
      pc.createOffer().then(function(o) { return pc.setLocalDescription(o); });
      pc.onicecandidate = function(e) {
        if (done || !e || !e.candidate) return;
        var m = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
        if (m && m[1] !== '0.0.0.0') { done = true; pc.close(); cb(m[1]); }
      };
      setTimeout(function() { if (!done) { done = true; pc.close(); cb(null); } }, 3000);
    } catch (e) { cb(null); }
  }

  // ── Connect ──
  $('connect-btn').addEventListener('click', function() {
    if (!selectedServer) return;
    reconnectAttempts = 0;
    doConnect();
  });

  function doConnect() {
    showError('');
    showScreen('connecting');
    $('connecting-sub').textContent = 'Setting up display';

    var host = selectedServer.host, port = selectedServer.port;
    ws = new WebSocket('ws://' + host + ':' + port + '/ws');

    ws.onopen = function() {
      $('connecting-sub').textContent = 'Sending screen info…';
      var dpr = window.devicePixelRatio || 1;
      ws.send(JSON.stringify({
        type: 'hello',
        data: { width: Math.round(screen.width * dpr), height: Math.round(screen.height * dpr), dpr: dpr, name: 'Vior Mobile', mode: selectedMode }
      }));
    };

    ws.onmessage = function(e) {
      var msg = JSON.parse(e.data);
      if (msg.type === 'ready') {
        displayW = parseInt(msg.data.resolution.split('x')[0]);
        displayH = parseInt(msg.data.resolution.split('x')[1]);
        localStorage.setItem('vior_last', host + ':' + port);
        frameBaseUrl = 'http://' + host + ':' + port;
        $('stream-device').textContent = serverName;
        $('stream-badge').textContent = selectedMode;
        $('pill-dot').className = 'pill-dot';
        $('pill-text').textContent = 'Connected';
        $('stream-loading').classList.remove('hidden');
        showScreen('stream');
        startFramePolling();
        startOverlayAutoHide();
        showToast('Connected to ' + serverName, 'ok');
      } else if (msg.type === 'error') {
        showScreen('disc');
        showError(msg.data.message || 'Connection failed');
        showToast(msg.data.message || 'Connection failed', 'error');
        $('connect-btn').disabled = false;
        $('connect-btn').textContent = 'Connect';
      }
    };

    ws.onclose = function() {
      stopFramePolling();
      if (currentScreen === 'stream' && reconnectAttempts < maxReconnect) {
        reconnectAttempts++;
        $('pill-dot').className = 'pill-dot reconnecting';
        $('pill-text').textContent = 'Reconnecting (' + reconnectAttempts + '/' + maxReconnect + ')';
        var delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 10000);
        setTimeout(function() { if (currentScreen === 'stream') doConnect(); }, delay);
      } else if (currentScreen !== 'disc') {
        showScreen('disc');
        showToast('Disconnected', 'error');
        $('connect-btn').disabled = false;
        $('connect-btn').textContent = 'Connect';
      }
    };

    ws.onerror = function() {};
  }

  // ── Cancel / Back ──
  $('cancel-btn').addEventListener('click', function() {
    if (ws) { ws.close(); ws = null; }
    showScreen('disc');
    $('connect-btn').disabled = false;
    $('connect-btn').textContent = 'Connect';
  });

  $('back-btn').addEventListener('click', function() {
    reconnectAttempts = maxReconnect;
    stopFramePolling();
    if (ws) { ws.close(); ws = null; }
    cleanupBlob();
    streamImg.src = '';
    showScreen('disc');
    $('connect-btn').disabled = false;
    $('connect-btn').textContent = 'Connect';
  });

  // ── Manual ──
  $('manual-go').addEventListener('click', manualGo);
  $('manual-ip').addEventListener('keydown', function(e) { if (e.key === 'Enter') manualGo(); });
  $('retry-btn').addEventListener('click', startDiscovery);

  function manualGo() {
    var v = $('manual-ip').value.trim();
    if (!v) return;
    var p = v.split(':'), host = p[0], port = p.length > 1 ? parseInt(p[1]) : 8080;
    probeServer(host, port);
    selectServer(host, port, host);
  }

  // ── Frame polling (fetch + blob — bypasses mixed content) ──
  function startFramePolling() { framePolling = true; pollFrame(); }
  function stopFramePolling() { framePolling = false; }
  function cleanupBlob() { if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; } }

  function pollFrame() {
    if (!framePolling) return;
    fetch(frameBaseUrl + '/snapshot?t=' + Date.now())
      .then(function(r) { if (!r.ok) throw 0; return r.blob(); })
      .then(function(blob) {
        if (!framePolling) return;
        cleanupBlob();
        blobUrl = URL.createObjectURL(blob);
        streamImg.src = blobUrl;
        var ld = $('stream-loading');
        if (ld && !ld.classList.contains('hidden')) ld.classList.add('hidden');
        reconnectAttempts = 0;
        if ($('pill-dot').classList.contains('reconnecting')) {
          $('pill-dot').className = 'pill-dot';
          $('pill-text').textContent = 'Connected';
        }
        requestAnimationFrame(pollFrame);
      })
      .catch(function() { if (framePolling) setTimeout(pollFrame, 150); });
  }

  // ── Overlay auto-hide ──
  function startOverlayAutoHide() { showOverlay(); streamImg.addEventListener('click', toggleOverlay); }
  function showOverlay() {
    $('stream-overlay').classList.remove('dimmed');
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(function() { $('stream-overlay').classList.add('dimmed'); }, 3500);
  }
  function toggleOverlay() {
    var ov = $('stream-overlay');
    if (ov.classList.contains('dimmed')) showOverlay();
    else { clearTimeout(overlayTimer); ov.classList.add('dimmed'); }
  }

  // ── Touch input ──
  function mapT(t) {
    var r = streamImg.getBoundingClientRect();
    return { x: Math.round((t.clientX-r.left)/r.width*displayW), y: Math.round((t.clientY-r.top)/r.height*displayH) };
  }
  function sendI(a, x, y) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type:'input', data:{ event:'touch', action:a, x:x, y:y } }));
  }
  streamImg.addEventListener('touchstart', function(e) { e.preventDefault(); var p=mapT(e.changedTouches[0]); sendI('down',p.x,p.y); }, {passive:false});
  streamImg.addEventListener('touchmove', function(e) { e.preventDefault(); var p=mapT(e.changedTouches[0]); sendI('move',p.x,p.y); }, {passive:false});
  streamImg.addEventListener('touchend', function(e) { e.preventDefault(); var p=mapT(e.changedTouches[0]); sendI('up',p.x,p.y); }, {passive:false});

  // ── USB callbacks ──
  window.onUsbFrame = function(b64) {
    if (currentScreen !== 'stream') showScreen('stream');
    streamImg.src = 'data:image/jpeg;base64,' + b64;
    var ld = $('stream-loading');
    if (ld && !ld.classList.contains('hidden')) ld.classList.add('hidden');
  };
  window.onUsbConnected = function() {
    $('pill-dot').className = 'pill-dot';
    $('pill-text').textContent = 'USB · Connected';
    $('stream-badge').textContent = 'USB';
  };
  window.onUsbDisconnected = function() { if (currentScreen === 'stream') showScreen('disc'); };

  // ── Helpers ──
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ── Boot ──
  startDiscovery();
})();
</script>
</body>
</html>
