name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev

      - name: Build CLI
        run: go build -o vior ./cmd/vior/

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Test
        run: go test ./internal/... -short

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: vior-${{ runner.os }}-${{ runner.arch }}
          path: vior*

  mobile:
    name: Mobile (Android APK)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev

      - name: Install gogio
        run: go install gioui.org/cmd/gogio@latest

      - name: Build Android APK
        run: |
          cd mobile
          ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125 gogio -target android -appid com.vior.mobile -version 0.1.0.1 -permissions android.permission.INTERNET,android.permission.ACCESS_NETWORK_STATE,android.permission.ACCESS_WIFI_STATE -o vior-mobile.apk .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vior-mobile-android
          path: mobile/vior-mobile.apk
